# tmux (macOS / Linux / WSL). Reload: prefix + r

# --- Basics ------------------------------------------------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -sg escape-time 0          # no Esc delay (nvim, zsh vi mode)
set -g focus-events on         # lets nvim notice files changed elsewhere
set -g mouse on
set -g history-limit 50000
set -g base-index 1            # windows and panes start at 1
setw -g pane-base-index 1
set -g renumber-windows on     # close window 2 of 3 -> the rest become 1, 2

# Quiet: no bells or activity flashes.
set -g bell-action none
set -g visual-bell off
set -g visual-activity off
setw -g monitor-activity off

# --- Terminal ----------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"        # 24-bit colour (Ghostty, Windows Terminal)
set -s set-clipboard on                         # copy to the system clipboard via OSC 52
set -as terminal-features ",xterm*:clipboard"
set -g allow-passthrough on                     # let programs talk to the terminal (images, etc.)

# Distinguish key combos such as Shift+Enter (needed by Pi). -q: older tmux lacks the format option.
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"
set -sq extended-keys-format csi-u

# --- Keys --------------------------------------------------------------------

bind r source-file "~/.config/tmux/tmux.conf" \; display "tmux.conf reloaded"

# Splits and new windows keep the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Prefix + h/j/k/l moves, prefix + H/J/K/L resizes (repeatable).
# -Z on every move: if the window is zoomed, the pane you move to is zoomed too.
bind h select-pane -Z -L
bind j select-pane -Z -D
bind k select-pane -Z -U
bind l select-pane -Z -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+1..9 jumps straight to a window.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Ctrl+h/j/k/l moves between tmux panes AND nvim splits (christoomey/vim-tmux-navigator;
# nvim has the matching plugin). Keys pass through to nvim and fzf.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -Z -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -Z -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -Z -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -Z -R'
bind -T copy-mode-vi C-h select-pane -Z -L
bind -T copy-mode-vi C-j select-pane -Z -D
bind -T copy-mode-vi C-k select-pane -Z -U
bind -T copy-mode-vi C-l select-pane -Z -R

# Ctrl+L now moves panes, so prefix + Ctrl+L clears the screen.
bind C-l send-keys C-l

# --- Copy mode (vi) ----------------------------------------------------------

setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel   # goes to the system clipboard

# --- Status bar --------------------------------------------------------------
# Only terminal palette colours (no hex), so it follows Ghostty's gruvbox and
# switches with light/dark mode automatically.

set -g status-position top
set -g status-justify absolute-centre
set -g status-style default
set -g message-style "fg=yellow"
set -g status-left-length 30
set -g status-left "#[fg=yellow bold] #S "
set -g status-right "#{?client_prefix,#[fg=red bold]PREFIX ,}"

setw -g window-status-separator ""

# Pi markers on each window:
#   yellow ● while any pane in it shows a progress bar (Pi's "Terminal progress" setting),
#   green ✔ after a bell (pi-tmux-bell extension: Pi finished or needs input) until you visit.
# status-interval keeps the dot current; the bell flag itself shows immediately.
set -g status-interval 1
setw -g monitor-bell on
setw -g window-status-bell-style default
pi_busy="#{?#{P:#{?#{==:#{pane_pb_state},hidden},,1}},#[fg=yellow] ●,}"
pi_done="#{?window_bell_flag,#[fg=green] ✔,}"
setw -g window-status-format "#[fg=brightblack] #I #W$pi_busy$pi_done "
setw -g window-status-current-format "#[fg=default bold] #I #W#{?window_zoomed_flag,#[fg=yellow] Z,}$pi_busy "

# Window names: "folder: program", or just "folder" at an idle shell.
# %hidden keeps these helper variables out of the shell environment.
%hidden win_is_pi="#{m:π*,#{pane_title}}"
%hidden win_is_shell='#{m/r:^(zsh|bash|sh|fish)$,#{pane_current_command}}'
%hidden win_is_home="#{==:#{pane_current_path},$HOME}"

%hidden win_dir="#{?${win_is_home},~,#{b:pane_current_path}}"
# Icons (Nerd Font). Each line is the icon if the program matches, else empty;
%hidden win_icon_pi="#{?${win_is_pi},\U000f03ff,}"
%hidden win_icon_nvim="#{?#{m/r:^(nvim|lvim)\$,#{pane_current_command}},\uf36f,}"
%hidden win_icon_git="#{?#{==:#{pane_current_command},lazygit},\ue702,}"
%hidden win_icon_node="#{?${win_is_pi},,#{?#{==:#{pane_current_command},node},\ue718,}}"
%hidden win_icon_dotnet="#{?#{==:#{pane_current_command},dotnet},\ue77f,}"
%hidden win_icon_docker="#{?#{==:#{pane_current_command},docker},\uf308,}"
%hidden win_icon_ssh="#{?#{==:#{pane_current_command},ssh},\U000f08c0,}"
%hidden win_icon_top="#{?#{m/r:^(htop|btop)\$,#{pane_current_command}},\uf0e4,}"
%hidden win_icon="${win_icon_pi}${win_icon_nvim}${win_icon_git}${win_icon_node}${win_icon_dotnet}${win_icon_docker}${win_icon_ssh}${win_icon_top}"

# Icon if there is one, otherwise the program name
%hidden win_prog="#{?${win_icon},${win_icon},#{pane_current_command}}"

setw -g automatic-rename-format "#{?${win_is_shell},${win_dir},${win_dir}: ${win_prog}}"

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=yellow"
